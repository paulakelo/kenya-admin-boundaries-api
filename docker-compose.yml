services:
  db:
    image: postgis/postgis:15-3.3
    container_name: spatial_pg
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c effective_cache_size=128MB
      -c max_connections=25
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_DB: ${POSTGRES_DB:-spatial_db}
    ports: [] # published via docker-compose.override.yml in dev
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_password

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spatial_api
    environment:
      PORT: 8080
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:Kapcherop250.@db:5432/${POSTGRES_DB:-spatial_db}?sslmode=disable
      STATIC_DIR: /app/frontend/dist
    ports:
      - "18080:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
    driver: local

secrets:
  postgres_password:
    file: ./secrets/postgres_password
