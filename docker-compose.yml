services:
  db:
    image: postgis/postgis:15-3.3
    container_name: spatial_pg
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c effective_cache_size=128MB
      -c max_connections=25
    # In production, provide secrets via Docker secrets (or a secrets manager).
    # This service reads POSTGRES_PASSWORD from the file mounted at /run/secrets/postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_DB: ${POSTGRES_DB:-spatial_db}
    ports: [] # avoid publishing ports by default in production
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_password

volumes:
  pg_data:
    driver: local

secrets:
  postgres_password:
    file: ./secrets/postgres_password
